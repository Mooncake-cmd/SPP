<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 7" shape-rendering="crispEdges">
  <!-- Coração pixelado original, inspirado na cor do coração do modo Hardcore do Minecraft (não é a
       textura do jogo — é um desenho nosso, no mesmo estilo em blocos e na mesma paleta escura). -->
  <rect x="1" y="0" width="2" height="1" fill="#7a0000"/>
  <rect x="5" y="0" width="2" height="1" fill="#7a0000"/>
  <rect x="0" y="1" width="8" height="1" fill="#7a0000"/>
  <rect x="0" y="2" width="8" height="1" fill="#7a0000"/>
  <rect x="0" y="3" width="8" height="1" fill="#7a0000"/>
  <rect x="1" y="4" width="6" height="1" fill="#4a0000"/>
  <rect x="2" y="5" width="4" height="1" fill="#4a0000"/>
  <rect x="3" y="6" width="2" height="1" fill="#4a0000"/>
</svg>
